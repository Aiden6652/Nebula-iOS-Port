# Nebula iOS — 统一编译器（JIT）版
#
# 解释器已废除，原 standard / pro 合并为一份：始终走 JIT 编译执行。
# 实测两种旧模式都要在 mono_trampolines_init 生成 trampoline，解释器并未省下
# JIT 能力，反而更慢、还多一套构建分支 —— 故只出一个包。
#
# 前提：dynamic-codesigning 权限（由 StikDebug / 全能签 entitlements 提供），
# 没有则 mono 初始化会被内核秒杀。increased-memory-limit 强烈建议（放宽 jetsam 软顶）。
#
# 用法：默认即本配置（NEBULA_PROFILE=standard），无需切换。

runtime.mode = jit

gc.nursery_mb = 32
gc.soft_limit_mb = 512
gc.hard_limit_mb = 500
gc.watchdog_interval_ms = 2000

# Addons 必须全加载 —— 职业定义就在 addon 的脚本里，漏一个就玩不了。
# 实测：全部 28 个 addon 的职业逻辑只有 4.2MB（.cs 3.55MB + .dll 0.64MB），很便宜。
# 真正的大头是 2423 张 png（97.8MB），所以下面全靠"贴图按需+降分辨率+LRU"来压。
addons.mode = all
addons.texture_max_px = 1024
addons.texture_cache_mb = 128
addons.audio_lazy = 1

# addon 脚本应在打包期于 PC 上预编译成 dll，运行时不加载 Roslyn（省上百 MB 峰值）
roslyn.enabled = 0

# 不锁帧，交给设备自己跑满（JIT 够快）。保留自适应兜底：掉帧先降贴图再压缓存。
render.target_fps = 0
render.adaptive = 1

interop.lazy = 1
