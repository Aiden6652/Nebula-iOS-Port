# Nebula iOS — Standard 版（纯解释器）
#
# 定位：发给所有人。不要求 dynamic-codesigning，不要求 increased-memory-limit。
# 解释器跑 IL，虽然比 JIT 慢，但不需要"可写又可执行"的内存，任何设备都能跑。
#
# 用法：NEBULA_PROFILE=standard（默认）

runtime.mode = interp

gc.nursery_mb = 16
gc.soft_limit_mb = 320
gc.watchdog_interval_ms = 2000

# Addons 必须全加载 —— 职业定义就在 addon 的脚本里，漏一个就玩不了。
# 实测：全部 28 个 addon 的职业逻辑只有 4.2MB（.cs 3.55MB + .dll 0.64MB），很便宜。
# 真正的大头是 2423 张 png（97.8MB），所以下面全靠"贴图按需+降分辨率+LRU"来压。
addons.mode = all
addons.texture_max_px = 512
addons.texture_cache_mb = 64
addons.audio_lazy = 1

# addon 脚本应在打包期于 PC 上预编译成 dll，运行时不加载 Roslyn（省上百 MB 峰值）
roslyn.enabled = 0

# 锁 60 帧。解释器比 JIT 慢，锁帧的意义是"把每秒的算力换成分给每一帧的预算"——
# 宁可稳定 60，也不要忽高忽低的卡顿。
render.target_fps = 60
# 掉帧时自动降画质：先降贴图分辨率，再压贴图 LRU 缓存
render.adaptive = 1

interop.lazy = 1
