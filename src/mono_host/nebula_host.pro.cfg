# Nebula iOS — Pro 版（强制 JIT）
#
# 定位：只发给能开权限的人。前提两个，缺一不可：
#   1. dynamic-codesigning  —— JIT 要"可写又可执行"的内存，没有会直接崩
#   2. increased-memory-limit —— 软顶放宽到 512MB，没有会被 jetsam 杀
# 拿到的是性能，代价是这俩权限。
#
# 用法：NEBULA_PROFILE=pro

runtime.mode = jit

gc.nursery_mb = 32
gc.soft_limit_mb = 512
gc.watchdog_interval_ms = 2000

# 和 Standard 一样：addons 全加载，职业一个都不能少。
# Pro 只是把贴图分辨率和缓存上限放宽，画质更好。
addons.mode = all
addons.texture_max_px = 1024
addons.texture_cache_mb = 128
addons.audio_lazy = 1

roslyn.enabled = 0

# Pro 不限制帧率，交给设备自己跑满（JIT 够快，不需要靠锁帧换每帧预算）
render.target_fps = 0
# 仍然保留自适应兜底：万一掉帧，先降贴图再压缓存，而不是掉帧硬扛
render.adaptive = 1

interop.lazy = 1
