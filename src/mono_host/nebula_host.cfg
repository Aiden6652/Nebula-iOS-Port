# Nebula iOS 宿主配置
#
# 默认按"最差的设备"来配：不假定有 increased-memory-limit、不假定有 dynamic-codesigning。
# 能开权限的人自己把 runtime.mode 改成 jit、把 addons 放开。
#
# 放在 dylib 同目录；也可用环境变量 NEBULA_HOST_CFG 指向别处。

# ---- 运行时模式 ------------------------------------------------------------
# interp : 解释器。不需要可执行内存、不需要任何权限，处处能跑（默认）
# jit    : JIT。快，但要求进程带 dynamic-codesigning，否则直接崩
# auto   : 先试 JIT，失败回退解释器
runtime.mode = interp

# ---- GC --------------------------------------------------------------------
# SGen nursery 大小(MB)。调小可压低常驻，代价是 minor GC 更频繁。
gc.nursery_mb = 16
# RSS 软顶(MB)：超过就触发一次全代 GC。这是防 OOM 的主闸门。
gc.soft_limit_mb = 320
# 看门狗采样间隔(毫秒)
gc.watchdog_interval_ms = 2000

# ---- Addons ----------------------------------------------------------------
# on_demand : 按需加载（默认）。28 个全开要 110MB，必炸。
# none      : 一个都不加载
# all       : 全量（仅限能开大内存权限的设备）
addons.mode = on_demand
# on_demand 模式下默认预启的（语言包之类必需项）
addons.default_enabled = SCLangPack,Plan17Languagev3.3.1,Plan17Resourcesv3.3.1

# ---- Addon 脚本编译 -------------------------------------------------------
# false: 不加载 Roslyn（推荐）。addon 脚本应在打包期于 PC 上预编译成 dll。
# true : 运行时用 Roslyn 编译脚本，峰值工作集会涨上百 MB。
roslyn.enabled = false

# ---- interop ---------------------------------------------------------------
# 按需加载 unhollowed 包装层，不在启动时全量预载。
interop.lazy = true
