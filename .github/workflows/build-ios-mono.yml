name: iOS 交叉编译 - Legacy Mono 版 (arm64)

on:
  workflow_dispatch:
  push:
    branches: [legacy-mono]
    paths:
      - 'scripts/**'
      - 'src/mono_host_mono/**'
      - '.github/workflows/build-ios-mono.yml'

# 独有并发组，避免与 IL2CPP 版的 nebula-ios-cross 重名冲突 / 互相取消。
concurrency:
  group: nebula-ios-cross-mono
  cancel-in-progress: true

jobs:
  mono-ios:
    name: '1/2 从源码编译 mono iOS arm64（修 sdb trampoline）'
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          echo "python3: $(python3 --version 2>&1)"
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo MISSING)"
          echo "disk free:"; df -h ~ | tail -1

      - name: 恢复 mono 编译缓存（避免每轮全量重编）
        uses: actions/cache@v4
        with:
          path: ~/mono-installs
          # 复用 IL2CPP 版同样的 mono 前缀缓存（Mono 运行时与后端无关，JIT 闸门一致）
          key: mono-ios-${{ runner.os }}-arm64-v2-${{ hashFiles('scripts/build_mono_ios.sh') }}

      - name: 从源码编译 mono iOS（替换预编译包）
        run: bash scripts/build_mono_ios.sh

      - name: 上传 Mono iOS 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mono-ios-arm64
          path: ~/mono-installs
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

  host-dylib:
    name: '2/2 交叉编译 Legacy Mono 宿主 dylib → iOS arm64'
    needs: mono-ios
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 取回 Mono iOS 产物
        uses: actions/download-artifact@v4
        with:
          name: mono-ios-arm64
          path: ~/mono-installs

      - name: 交叉编译 Legacy Mono 宿主 dylib
        run: bash src/mono_host_mono/build_ios_mono.sh "$HOME/mono-installs"

      - name: 上传 Legacy Mono 宿主 dylib
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-mono-host-ios-legacy
          path: src/mono_host_mono/out-ios/
          if-no-files-found: warn
