name: Build Nebula-iOS dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 新推送立即取消正在排队/运行的旧任务，避免堆积等待
concurrency:
  group: nebula-ios-build
  cancel-in-progress: true

jobs:
  # macOS：交叉编译 iOS arm64 dylib
  #    固定用 macos-14：macos-latest 队列等待时间长；14 的镜像启动更快
  #    注：原 Linux 测试 job 已移除（它只是跑 host 端测试，
  #        本地每次提交前都会跑全量验证，放在 CI 里只会占队列、拖慢出包）
  build-dylib:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # macos-14 上 Xcode 路径可能是 Xcode_15.x.app，逐个探测而不是写死
        run: |
          XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "使用 Xcode: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcrun --sdk iphoneos --show-sdk-path
      - name: Build dylib (arm64-ios)
        run: cd src/dylib && make
      - name: Verify artifact
        run: file src/dylib/nebula_ios_loader.dylib
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: nebula-ios-dylib
          path: src/dylib/*.dylib
