name: Build & Test Nebula-iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ① Linux：跑 host 端协议 + 分发层 + 本地内核测试（抓回归，不依赖真机）
  test-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run host tests
        run: cd src/net && make test
      - name: Build & run local-core tests
        run: cd src/core && make test
      - name: Build & run il2cpp bridge tests
        run: cd src/il2cpp && make test
      - name: Run Python reference simulators
        run: |
          python3 tools/sim/protocol_sim.py
          python3 tools/sim/core_sim.py
          python3 tools/sim/full_game_sim.py

  # ② macOS：交叉编译 iOS arm64 dylib
  build-dylib:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build dylib (arm64-ios)
        run: cd src/dylib && make
      - name: Verify artifact
        run: file src/dylib/nebula_ios_loader.dylib
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: nebula-ios-dylib
          path: src/dylib/*.dylib
