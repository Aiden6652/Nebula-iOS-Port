name: iOS 交叉编译 (arm64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/mono_host/**'
      - '.github/workflows/build-ios.yml'

jobs:
  mono-ios:
    name: '1/2 交叉编译 Mono → iOS arm64 (留 JIT + 解释器)'
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: 装构建依赖
        run: |
          brew install autoconf automake libtool pkg-config 2>/dev/null || true
          echo "autoconf: $(autoconf --version 2>/dev/null | head -1 || echo none)"
          echo "python3: $(python3 --version 2>&1)"
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: 构建 Mono 运行时 + iOS BCL
        run: bash scripts/build_mono_ios.sh

      - name: 上传 Mono iOS 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mono-ios-arm64
          path: ~/mono-installs
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: 上传 manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mono-ios-manifest
          path: ~/mono_ios_manifest.txt
          if-no-files-found: warn

  host-dylib:
    name: '2/2 交叉编译宿主 dylib → iOS arm64'
    needs: mono-ios
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 取回 Mono iOS 产物
        uses: actions/download-artifact@v4
        with:
          name: mono-ios-arm64
          path: ~/mono-installs

      - name: 交叉编译宿主 dylib
        run: bash src/mono_host/build_ios.sh "$HOME/mono-installs"

      - name: 上传宿主 dylib
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-mono-host-ios
          path: src/mono_host/out-ios/
          if-no-files-found: warn
