name: iOS 交叉编译 (arm64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/mono_host/**'
      - '.github/workflows/build-ios.yml'

# 独有并发组（与 build.yml 不重名），避免同一 commit 重复跑 15 分钟 mono 重编；
# 同时绝不与 build.yml 共享组，从而不会被 build.yml 取消。
concurrency:
  group: nebula-ios-cross
  cancel-in-progress: true

jobs:
  mono-ios:
    name: '1/2 从源码编译 mono iOS arm64（修 sdb trampoline）'
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          echo "python3: $(python3 --version 2>&1)"
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo MISSING)"
          echo "disk free:"; df -h ~ | tail -1

      - name: 恢复 mono 编译缓存（避免每轮全量重编）
        uses: actions/cache@v4
        with:
          # key 绑定脚本内容 hash：脚本/补丁/构建命令一改就自动失效重编
          path: ~/mono-installs
          # v2：旧缓存条目里是残缺产物（缺 libSystem.*.a），bump 后强制重编
          key: mono-ios-${{ runner.os }}-arm64-v2-${{ hashFiles('scripts/build_mono_ios.sh') }}

      - name: 从源码编译 mono iOS（替换预编译包）
        run: bash scripts/build_mono_ios.sh

      - name: 上传 Mono iOS 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mono-ios-arm64
          path: ~/mono-installs
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: 上传 manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mono-ios-manifest
          path: ~/mono_ios_manifest.txt
          if-no-files-found: warn

  host-dylib:
    name: '2/2 交叉编译宿主 dylib → iOS arm64'
    needs: mono-ios
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 取回 Mono iOS 产物
        uses: actions/download-artifact@v4
        with:
          name: mono-ios-arm64
          path: ~/mono-installs

      - name: 交叉编译宿主 dylib
        run: bash src/mono_host/build_ios.sh "$HOME/mono-installs"

      - name: 上传宿主 dylib
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-mono-host-ios
          path: src/mono_host/out-ios/
          if-no-files-found: warn
